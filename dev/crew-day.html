<title>Crew Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first app shell; one scrolling panel per tab, tab bar fixed at the bottom */
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --ink:#16242A; --muted:#566A70; --line:#DAE5E6;
  --accent:#C77A0A; --accent-ink:#FFFFFF; --accent-soft:#FBEBD2; --night:#1B2A4A; --hl:#F2A93B;
  --ok:#1E7A4F; --danger:#B3261E; --leave:#5B4BB7;
  --display:"Nunito",ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"Nunito",ui-rounded,ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#141C2F; --ink:#E7EAF2; --muted:#98A1B5; --line:#263049;
  --accent:#F2A93B; --accent-ink:#1A1206; --accent-soft:#3A2A10; --night:#0F1A33;
  --ok:#5CCB93; --danger:#F2867E; --leave:#A99BF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141C2F; --ink:#E7EAF2; --muted:#98A1B5; --line:#263049;
  --accent:#F2A93B; --accent-ink:#1A1206; --accent-soft:#3A2A10; --night:#0F1A33;
  --ok:#5CCB93; --danger:#F2867E; --leave:#A99BF0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;min-width:0}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field>label{font-size:13px;font-weight:600}
input,select{width:100%;box-sizing:border-box;font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px}
input[type=time],input.num{font-family:var(--mono)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 14px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px;min-height:40px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* boarding-pass summary */
.pass{background:var(--surface);border:1.5px solid var(--accent);color:var(--ink);border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;overflow:hidden}
.pass div{display:grid;gap:2px;min-width:0}
.pass .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pass .v{font:700 clamp(20px,6vw,28px) var(--mono);font-variant-numeric:tabular-nums}
.pass .v.hl{color:var(--accent)}
.pass .d{font-size:12px;color:var(--muted)}
.timeline{display:grid;gap:0}
.step{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .t{font:700 16px var(--mono);font-variant-numeric:tabular-nums}
.step .t.alarm{color:var(--accent)}
.step .n{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:6px;min-width:0}
.step .n input{min-height:40px;padding:7px 9px;font-size:15px}
.step .fixed{font-weight:600;padding:9px 0}
.bell{width:40px;height:40px;min-height:40px;padding:0;display:grid;place-items:center;border-radius:10px}
.bell[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bell svg{width:18px;height:18px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:22px;height:22px;min-height:22px;flex:none;accent-color:var(--accent)}
.chk span{flex:1;min-width:0;overflow-wrap:anywhere}
.chk.done span{color:var(--muted);text-decoration:line-through}
button.pick{min-height:38px;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--bg)}
button.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.big{font:700 36px var(--mono);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
td.m{font-family:var(--mono)}
.tablewrap{overflow-x:auto}
.stat{display:grid;gap:2px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:var(--bg)}
.note{font-size:13px;color:var(--muted);margin:0}
.status{font-size:12px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .tabs{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.wk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk .dn{display:grid;line-height:1.15}
.wk .dn b{font-family:var(--display);font-size:15px}
.wk .dn span{font:700 20px var(--mono)}
.wk.today .dn{color:var(--accent)}
.kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-right:6px}
.kind.flying{background:var(--accent-soft);color:var(--accent)}
.kind.standby{background:color-mix(in srgb,var(--night) 14%,transparent);color:var(--ink)}
.kind.off{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.kind.other{background:var(--line);color:var(--muted)}
.kind.leave{background:color-mix(in srgb,var(--leave) 18%,transparent);color:var(--leave)}
.kind.sick{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.kind.vto{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.calc{min-height:62px;padding:4px 3px;border-radius:10px;display:grid;align-content:start;justify-items:center;gap:1px;background:var(--bg);border:1px solid transparent;font:500 12px var(--body);position:relative}
.calc.out{opacity:.4}
.calc .cd{font:700 14px var(--mono)}
.calc .cb{width:70%;height:4px;border-radius:99px;margin:2px 0}
.calc .cxw{font:700 8.5px/1.1 var(--body);letter-spacing:-.01em;text-align:center;overflow-wrap:normal;word-break:keep-all;max-width:100%;white-space:normal}
.calc{padding-inline:1px}
.calc .ct{font:600 10px var(--mono);font-variant-numeric:tabular-nums}
.calc .cx{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-align:center;line-height:1.25;white-space:pre-line}
.calc.k-flying .cb{background:var(--accent)}
.calc.k-standby .cb{background:var(--night)}
.calc.k-asby .cb{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,var(--night) 4px 8px)}
.calc.k-training .cb{background:#B7791F}
.calc.k-adty .cb{background:var(--muted)}
.kind.adty{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--ink)}
.kind.asby{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.kind.training{background:color-mix(in srgb,#B7791F 18%,transparent);color:var(--ink)}
:root[data-theme="dark"] .calc.k-standby .cb{background:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .calc.k-standby .cb{background:var(--muted)}}
.calc.k-off .cb{background:var(--ok)}
.calc.k-other .cb{background:var(--line)}
.calc.k-leave .cb{background:var(--leave)}
.calc.k-sick .cb{background:var(--danger)}
.calc.k-vto .cb{background:var(--muted)}
.calc.istoday .cd{color:var(--accent)}
.calc.sel{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--muted);font:700 15px var(--body);min-height:42px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,27,45,.15)}
.secrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:4px;align-items:center;padding:8px;border-radius:10px;background:var(--bg)}
.sectimes{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sectimes label{display:grid;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.secrow input{padding:7px 6px;font-size:14px;min-height:40px;font-family:var(--mono);background:var(--surface)}
.secrow button{min-height:36px;padding:0}
.sw{appearance:none;-webkit-appearance:none;width:44px!important;height:26px!important;min-height:26px!important;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;padding:0!important;border:0!important;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.newsgrid{display:grid;gap:8px}
.newsl{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-decoration:none}
/* colour themes (chosen in More › Choose your tools) */
.app.c-teal{--accent:#2E7D84;--accent-soft:#E2F1F2;--night:#23464B;--hl:#9AD7DC;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.c-teal{--accent:#7CC3C9;--accent-soft:#1B3436;--night:#12282B;--hl:#9AD7DC;--accent-ink:#0E1416}}
:root[data-theme="dark"] .app.c-teal{--accent:#7CC3C9;--accent-soft:#1B3436;--night:#12282B;--hl:#9AD7DC;--accent-ink:#0E1416}
.app.c-sage{--accent:#557A59;--accent-soft:#E2EDE1;--night:#2E4531;--hl:#B5DDB7;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.c-sage{--accent:#98C59B;--accent-soft:#203324;--night:#16241A;--hl:#B5DDB7;--accent-ink:#0E1416}}
:root[data-theme="dark"] .app.c-sage{--accent:#98C59B;--accent-soft:#203324;--night:#16241A;--hl:#B5DDB7;--accent-ink:#0E1416}
.app.c-sky{--accent:#3A6EA5;--accent-soft:#DFEAF6;--night:#23406A;--hl:#A9CDF2;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.c-sky{--accent:#8BB6E6;--accent-soft:#1C2B3D;--night:#121F33;--hl:#A9CDF2;--accent-ink:#0E1416}}
:root[data-theme="dark"] .app.c-sky{--accent:#8BB6E6;--accent-soft:#1C2B3D;--night:#121F33;--hl:#A9CDF2;--accent-ink:#0E1416}
.app.c-lavender{--accent:#6A62A6;--accent-soft:#E8E5F5;--night:#38335F;--hl:#C4BDF0;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.c-lavender{--accent:#ADA5E3;--accent-soft:#29253F;--night:#1D1A31;--hl:#C4BDF0;--accent-ink:#0E1416}}
:root[data-theme="dark"] .app.c-lavender{--accent:#ADA5E3;--accent-soft:#29253F;--night:#1D1A31;--hl:#C4BDF0;--accent-ink:#0E1416}
.app.c-rose{--accent:#A35D6E;--accent-soft:#F4E4E8;--night:#5A2E3A;--hl:#F0B8C5;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.c-rose{--accent:#E3A2B1;--accent-soft:#3A2228;--night:#2A171C;--hl:#F0B8C5;--accent-ink:#0E1416}}
:root[data-theme="dark"] .app.c-rose{--accent:#E3A2B1;--accent-soft:#3A2228;--night:#2A171C;--hl:#F0B8C5;--accent-ink:#0E1416}
.app.c-amber{--accent:#C77A0A;--accent-soft:#FBEBD2;--night:#1B2A4A;--hl:#F2A93B;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app.c-amber{--accent:#F2A93B;--accent-soft:#3A2A10;--night:#0F1A33;--hl:#F2A93B;--accent-ink:#0E1416}}
:root[data-theme="dark"] .app.c-amber{--accent:#F2A93B;--accent-soft:#3A2A10;--night:#0F1A33;--hl:#F2A93B;--accent-ink:#0E1416}
.pass .now{position:relative}
.pass .now::after{content:"";position:absolute;left:0;right:12px;bottom:-8px;height:3px;border-radius:2px;background:var(--accent)}
.nowcard{gap:4px;border-color:var(--accent);background:var(--accent-soft)}
.nowcard b{font-family:var(--display);font-size:20px;line-height:1.2}
.sbnow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg)}
.sbnow>span{display:grid;gap:2px;min-width:0}
.sbnow b{font:700 26px var(--mono);font-variant-numeric:tabular-nums}
.sbnow.due{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.sbnow.due b{color:var(--accent)}
.ftlgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ftlgrid>div{display:grid;gap:2px;min-width:0}
.ftlgrid .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ftlgrid b{font:700 20px var(--mono);font-variant-numeric:tabular-nums}
.bigbtn{min-height:56px;font-size:17px;width:100%}
button.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.rcdue{border-color:var(--accent);background:var(--accent-soft)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2 .field{min-width:0}
.row2 input{width:100%;box-sizing:border-box}
.seccard{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .field{min-width:0}
.row3 input{width:100%;box-sizing:border-box;padding-inline:6px}
.wxrow{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.wxt{font-size:13px;color:var(--muted)}
.v,.t,b,input[type=time],[data-cdto],[data-cdfrom]{font-variant-numeric:tabular-nums}
main header:first-of-type{position:relative;min-height:78px;isolation:isolate}

function currentSick(){const t=today();return (S.sick||[]).filter(e=>daysBetween(e.to,t)<=1).sort((a,b)=>b.from.localeCompare(a.from))[0]||null}

function applySick(ep,from,to){
  ep.prev=ep.prev||{};
  sickDays(ep).forEach(d=>{if(d<from||d>to){if(ep.prev[d])S.roster[d]=ep.prev[d];else delete S.roster[d];delete ep.prev[d]}});
  ep.from=from;ep.to=to;
  sickDays(ep).forEach(d=>{const cur=S.roster[d];if(!(cur&&cur.kind==="sick"&&cur.src==="sick")){if(!(d in ep.prev))ep.prev[d]=cur||null;S.roster[d]={kind:"sick",report:"",off:"",dest:"",note:"Sick",src:"sick"}}});
}
function sickMessages(ep){
  const who=[S.me.name||"[your name]",idLabel().toLowerCase()+" "+(S.me.staffNo||"[number]")].join(", ");
  const missed=sickDays(ep).map(d=>[d,ep.prev&&ep.prev[d]]).find(x=>x[1]&&isDutyK(x[1].kind));
  const duty=missed?` my ${missed[1].kind==="standby"?"standby":"duty"} on ${fmtDate(missed[0],{weekday:"long",day:"numeric",month:"long"})}${missed[1].report?" (report "+missed[1].report+")":""}`:" my duties";
  const range=fmtDate(ep.from,{day:"numeric",month:"long"})+(ep.to!==ep.from?" to "+fmtDate(ep.to,{day:"numeric",month:"long"}):"");
  return {
    callIn:`Hi crewing, this is ${who}. I'm unwell${ep.reason?" ("+ep.reason+")":""} and won't be fit to operate${duty}. I expect to be off until ${fmtDate(ep.to,{weekday:"long",day:"numeric",month:"long"})}. I'll keep you updated${ep.type==="fitnote"?" and send my fit note":""}. Thank you.`,
    note:`Hi, please find attached my ${ep.type==="fitnote"?"fit note":"self-certification"} covering ${range}. ${who}. Thank you.`
  };
}

let fnState={files:[],rot:0,clear:true};
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>res({img,url});img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};img.src=url})}
function processImage(img,rot,clear,max){
  const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),side=rot%180!==0;
  const c=document.createElement("canvas");c.width=side?h:w;c.height=side?w:h;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-w/2,-h/2,w,h);
  if(clear){const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];g=(g-128)*1.45+140;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0)}
  return c;
}
function drawFitPreview(){
  const cv=document.getElementById("fn-prev"),info=document.getElementById("fn-info");if(!cv)return;
  const f=fnState.files[0];if(!f){cv.style.display="none";info.hidden=true;return}
  if(f.type==="application/pdf"){cv.style.display="none";info.hidden=false;info.textContent="PDF selected: "+f.name+". The header is added to the top of each page.";return}
  loadImg(f).then(({img,url})=>{const c=processImage(img,fnState.rot,fnState.clear,900);cv.width=c.width;cv.height=c.height;cv.getContext("2d").drawImage(c,0,0);cv.style.display="block";URL.revokeObjectURL(url);
    info.hidden=fnState.files.length<2;info.textContent=fnState.files.length+" photos selected: each becomes a page (rotation applies to all)."},()=>{info.hidden=false;info.textContent="That photo couldn't be opened. Try a JPG or PNG."});

function pdfSafe(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7E]/g,"?")}
async function makeFitNotePdf(btn){
  const ep=currentSick(),msg=$("#fnmsg");if(!ep)return;
  if(!fnState.files.length){msg.textContent="Choose a photo or PDF of your fit note first.";return}
  if(!window.PDFLib){msg.textContent="The PDF maker couldn't load. Check your connection and try again.";return}
  btn.disabled=true;msg.textContent="Making your PDF…";
  try{
    const {PDFDocument,StandardFonts,rgb}=window.PDFLib,doc=await PDFDocument.create(),font=await doc.embedFont(StandardFonts.Helvetica),bold=await doc.embedFont(StandardFonts.HelveticaBold);
    const head=[pdfSafe(`${S.me.name||"Name"} | ${idLabel()}: ${S.me.staffNo||"-"} | ${S.profile.airline} ${S.profile.base}`),pdfSafe(`Sick leave: ${fmtDate(ep.from,{day:"numeric",month:"long",year:"numeric"})} to ${fmtDate(ep.to,{day:"numeric",month:"long",year:"numeric"})} | ${ep.type==="fitnote"?"Fit note":"Self-certification"}`)];
    const stamp=(page,W,H)=>{page.drawRectangle({x:0,y:H-40,width:W,height:40,color:rgb(1,1,1)});page.drawText(head[0],{x:24,y:H-18,size:10,font:bold,color:rgb(0.08,0.1,0.18)});page.drawText(head[1],{x:24,y:H-32,size:9,font,color:rgb(0.25,0.27,0.33)})};
    for(const f of fnState.files){
      if(f.type==="application/pdf"){const src=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});const pages=await doc.copyPages(src,src.getPageIndices());pages.forEach(p=>{doc.addPage(p);const {width,height}=p.getSize();stamp(p,width,height)})}
      else{const {img,url}=await loadImg(f);const c=processImage(img,fnState.rot,fnState.clear,2000);URL.revokeObjectURL(url);
        const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)),jpg=await doc.embedJpg(await blob.arrayBuffer());
        const W=595.28,H=841.89,page=doc.addPage([W,H]),top=56,m=28,aw=W-2*m,ah=H-top-m,sc=Math.min(aw/jpg.width,ah/jpg.height),iw=jpg.width*sc,ih=jpg.height*sc;
        page.drawImage(jpg,{x:(W-iw)/2,y:m+(ah-ih)/2,width:iw,height:ih});stamp(page,W,H)}
    }
    const bytes=await doc.save(),res=await assetsNS.upload(new Blob([bytes],{type:"application/pdf"}),{type:"application/pdf"});
    if(ep.prepared)assetsNS.delete(ep.prepared).catch(()=>{});
    ep.prepared=res.id;fnState={files:[],rot:0,clear:fnState.clear};render();save();
  }catch(err){btn.disabled=false;msg.textContent=err&&err.code?uploadMsg(err):"That file couldn't be turned into a PDF. If it's a protected PDF, try a photo of it instead."}
}

function standbyTimes(o){const s=o||S.standby,[sh,sm]=(s.start||"05:00").split(":").map(Number),[eh,em]=(s.end||"13:00").split(":").map(Number);let a=sh*60+sm,b=eh*60+em;if(b<=a)b+=1440;const step=Math.max(15,+s.interval||60),out=[];for(let t=a;t<=b;t+=step){const m=t%1440;out.push(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"))}return out}

function monthComm(){const ym=today().slice(0,7);return S.sales.entries.filter(e=>(e.date||"").slice(0,7)===ym).reduce((s,e)=>s+(+e.sales||0)*(+e.rate||0)/100,0)}
function estimate(){
  const P=S.pay,comm=monthComm();
  const t=P.payType,use=x=>t===x||t==="mix";
  const variable=(use("sector")?(+P.sectorPay||0)*(+P.sectors||0):0)+(use("duty")?(+P.dutyRate||0)*(+P.dutyHours||0):0)+(use("flight")?(+P.flightRate||0)*(+P.flightHours||0):0);
  const D=deductions(variable);
  const gross=Math.max(0,(+P.basic||0)/12+variable+(+P.allowances||0)+comm-D.vto-D.unpaid-D.sick+D.ssp);
  const pension=gross*(+P.pension||0)/100;
  const A=gross*12,PA=12570,BR=37700,HR=125140;
  const taxable=Math.max(0,(A-pension*12)-PA);
  const tax=(Math.min(taxable,BR)*0.20+Math.max(0,Math.min(taxable,HR-PA)-BR)*0.40+Math.max(0,taxable-(HR-PA))*0.45)/12;
  const ni=(Math.max(0,Math.min(A,50270)-PA)*0.08+Math.max(0,A-50270)*0.02)/12;
  return {comm,gross,pension,tax,ni,net:gross-pension-tax-ni,D};
}
// money lost for VTO, unpaid leave and sick days this month (rough: airlines' rules differ)
const SSP_WEEK=123.25; // from 6 April 2026, paid from day one, capped at 80% of average weekly earnings
function deductions(variable){
  const P=S.pay,ym=today().slice(0,7),basic=+P.basic||0;
  const dr=P.dayMethod==="custom"?(+P.dayRate||0):basic/(P.dayMethod==="260"?260:365);
  const vtoN=Object.keys(S.roster).filter(d=>d.startsWith(ym)&&S.roster[d].kind==="vto").length;
  const sickSet=new Set();(S.sick||[]).forEach(e=>sickDays(e).forEach(d=>{if(d.startsWith(ym))sickSet.add(d)}));Object.keys(S.roster).forEach(d=>{if(d.startsWith(ym)&&S.roster[d].kind==="sick")sickSet.add(d)});
  const sickN=sickSet.size,unpaidN=Math.max(0,+P.unpaidDays||0);
  const sp=P.sickPay||"ssp",wk=(basic/12+(variable||0)+(+P.allowances||0))*12/52;
  const sick=sp==="full"?0:sp==="half"?sickN*dr*0.5:sickN*dr;
  const ssp=sp==="ssp"?sickN*Math.min(SSP_WEEK,wk*0.8)/7:0;
  return {dr,vtoN,sickN,unpaidN,vto:vtoN*dr,unpaid:unpaidN*dr,sick,ssp};
}

   App structure

/* ---------- folding sections (Today folds remember per phase, reset daily) ---------- */
function isOpen(k,def){return S.fold&&k in S.fold?!!S.fold[k]:!!def}
function fold(k,title,body,def,hint){const o=isOpen(k,def);
  return `<section class="card fold"><button class="foldh" data-fold="${k}" data-def="${def?1:0}" aria-expanded="${o}"><span class="ft">${title}</span><span class="fhint">${!o&&hint?hint:""}</span><span class="chev" aria-hidden="true"></span></button>${o?`<div class="fbody">${typeof body==="function"?body():body}</div>`:""}</section>`}
function fmtIn(ms){const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return h?h+"h "+String(m%60).padStart(2,"0")+"m":m+" min"}

/* ---------- the next duty (Plan) ---------- */
function rosterNext(after){return Object.keys(S.roster).filter(d=>d>after&&isDutyK(S.roster[d].kind)&&S.roster[d].report).sort()[0]||null}
function nextFromRoster(d){const e=S.roster[d],f=(e.sectors||[])[0]||{};return {date:d,report:r2l(d,e.report),end:r2l(d,e.off)||"",kind:e.kind==="standby"||hasEnd(e.kind)?e.kind:"flying",dest:e.dest||"",loc:e.loc||"",flt:f.flt||"",dep:r2l(d,f.dep)||"",src:"roster"}}
function nextDuty(){const t=today();if(S.next&&S.next.date>t)return S.next;const rn=rosterNext(t);
  S.next=rn?nextFromRoster(rn):{date:addDays(t,1),report:S.duty.report||"05:30",end:S.standby.end||"13:00",kind:"flying",dest:"",src:"manual"};return S.next}
function destOf(x){const name=cityFrom(x&&x.dest||""),c=CITIES.find(y=>y.name===name);return c?{city:c.name,country:c.country}:{city:name||"",country:""}}
function dutyCity(x){const d=destOf(x).city;if(d)return d;const r=x&&S.roster[x.date],z=((x&&x.sectors)||(r&&r.sectors)||[]).find(y=>y.to&&y.to!==S.profile.base);return z?destOf({dest:z.to}).city:""}
function dutyLabel(x){return esc(fmtDate(x.date,{weekday:"short",day:"numeric",month:"short"}))+" · "+(x.kind==="standby"||hasEnd(x.kind)?(x.kind==="asby"?"airport standby ":x.kind==="training"?"training ":x.kind==="adty"?"airport duty ":"home standby ")+esc(x.report)+(x.end?"–"+esc(x.end):""):"report "+esc(x.report))+(x.dest&&x.kind==="flying"?" · "+esc(destOf(x).city||x.dest):"")}

/* ---------- where today's duty is up to ---------- */
function sbWindow(o){const s=o||S.standby,d=(o&&o.date)||S.duty.date||today(),[sh,sm]=(s.start||s.report||"05:00").split(":").map(Number),st=new Date(d+"T00:00:00");st.setHours(sh,sm,0,0);
  const [eh,em]=(s.end||"13:00").split(":").map(Number);let en=new Date(d+"T00:00:00");en.setHours(eh,em,0,0);if(en<=st)en=new Date(en.getTime()+86400000);return {start:st,end:en}}
function fdpEnd(){const p=plan(),sec=((S.roster[S.duty.date]||{}).sectors||[]).filter(x=>!x.typ||x.typ!=="gt").length||2;
  /* called from airport standby (CS FTL.1.225(a)): FDP counts from the call, max FDP cut by standby over 4 h, standby + FDP max 16 h */
  if(S.duty.asbyCall&&S.duty.asbyStart){const fs=S.duty.asbyCall,ss=S.duty.asbyStart,mx=maxFDP(hm(new Date(fs)),sec)*60000-Math.max(0,fs-ss-4*3600000);return new Date(Math.min(fs+mx,ss+16*3600000))}
  return new Date(p.rep.getTime()+maxFDP(S.duty.report,sec)*60000)}
function asbyEnd(){return sbWindow({date:S.duty.date,start:S.duty.report,end:S.duty.end||"13:00"}).end}
function phaseOf(){
  const d=S.duty,now=new Date(),t=today();
  if(!d.date)return "none";
  if(d.kind==="standby"){if(d.date!==t)return d.date>t?"future":"none";if(calloutInfo())return "called";const w=sbWindow();return now<w.start?"sbbefore":now<=w.end?"sbon":"sbdone"}
  const p=plan();
  if(hasEnd(d.kind)){const e=asbyEnd();if(now>e)return "done";if(now>=p.rep)return d.kind==="asby"?"asby":d.kind==="adty"?"adty":"training"}
  else if(now>fdpEnd()||(dutyOff()&&now>dutyOff().at))return "done";
  if(p.first-now>12*3600000&&d.date!==t)return "future"; // on the duty day itself, always show it
  if(now<p.first)return "soon";
  if(now<p.leave.getTime()-30*60000)return "ready";
  if(now<p.rep)return "go";
  return "duty";
}

/* EASA home standby FTL (ORO.FTL.225 / CS FTL.1.225). Companies can have their own approved scheme. */
function nightOverlap(a,b){let ms=0;const d=new Date(a);d.setHours(0,0,0,0);d.setDate(d.getDate()-1);
  for(;d<b;d.setDate(d.getDate()+1)){const n1=new Date(d);n1.setHours(23,0,0,0);const n2=new Date(n1.getTime()+8*3600000);const x=Math.max(a.getTime(),n1.getTime()),y=Math.min(b.getTime(),n2.getTime());if(y>x)ms+=y-x}
  return ms}
function hsbyFtl(callAt){
  /* CS FTL.1.225(b): standby ends when you report. Max FDP is cut by standby time over 6 h (8 h with in-flight rest or split duty).
     If standby starts between 23:00 and 07:00, that night time doesn't count until you're contacted. Standby + FDP: max 18 h awake. */
  const w=sbWindow(),c=new Date(Math.max(w.start.getTime(),Math.min(callAt.getTime(),w.end.getTime()))),split=!!S.standby.ftlSplit,free=(split?8:6)*3600000;
  const sh=w.start.getHours(),nightStart=sh>=23||sh<7,excl=nightStart?nightOverlap(w.start,c):0;
  const rep=new Date(c.getTime()+calloutMins()*60000),sec=+S.standby.ftlSectors||2;
  const counted=Math.max(0,rep-w.start-excl),reduce=Math.max(0,counted-free);
  const maxF=maxFDP(hm(rep),sec)*60000,fdpByMax=new Date(rep.getTime()+maxF-reduce);
  let awakeFrom=w.start;if(nightStart){const seven=new Date(w.start);if(sh>=23)seven.setDate(seven.getDate()+1);seven.setHours(7,0,0,0);awakeFrom=c<seven?c:seven}
  const awake=new Date(awakeFrom.getTime()+18*3600000);
  const end=fdpByMax<awake?fdpByMax:awake;
  /* latest report before the FDP starts shrinking */
  let shrink=new Date(w.start.getTime()+free);if(nightStart)for(let i=0;i<3;i++)shrink=new Date(w.start.getTime()+free+nightOverlap(w.start,new Date(Math.min(shrink,c))));
  return {c,rep,counted,reduce,maxF,fdpEnd:end,limitBy:end===awake?"18 hours awake":"max FDP",shrink,len:w.end-w.start,sec,nightStart};
}
function fmtHM(ms){const m=Math.round(ms/60000);return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")}
function sbTransitLine(){if(!tHas())return "";const by=new Date(Date.now()+calloutMins()*60000);
  const opts=RK.filter(r=>tHas(r)).map(r=>nextDeps(r,by)).filter(x=>x.okArr).sort((a,b)=>a.okArr-b.okArr);
  return `<p style="margin:0">${opts.length?"If called now: "+opts.map(o=>`the <b>${o.next.find(x=>x.arr<=o.dl).t}</b> ${RNAME[o.rk]} (leave home ${hmL(o.leave)})`).join(" or ")+".":`<span style="color:var(--danger)">If called now, no saved train or bus gets you there in time.</span> Have a taxi number ready.`}</p>`}
function sbFtlBody(){
  const co=calloutInfo(),now=new Date(),w=sbWindow(),at=co?co.at:now<w.start?w.start:now,f=hsbyFtl(at),split=!!S.standby.ftlSplit;

        <div><span class="k">FDP ends by</span><b class="clk">${hm(f.fdpEnd)}</b><span class="note" style="margin:0">${f.limitBy==="max FDP"?"":"18h awake limit"}</span></div>

/* Tonight: a normal routine. Bed between 20:00 and 23:00 (never after midnight unless you land late),
   kit prepared in the evening for earlies and in the morning for lates. */
function at(dateStr,h,m){const d=new Date(dateStr+"T00:00:00");d.setHours(h,m||0,0,0);return d}
function clampD(d,lo,hi){return d<lo?lo:d>hi?hi:d}
function prevHome(x){
  const pd=addDays(x.date,-1),e=S.roster[pd];if(!e||!isDutyK(e.kind)||!e.off||e.kind==="standby")return null;
  let off=r2lDT(pd,e.off);if(e.report&&off<r2lDT(pd,e.report))off=new Date(off.getTime()+86400000);
  return new Date(off.getTime()+((+S.duty.commute||0)+15)*60000);
}
function sleepPlan(p,x){
  const type=dutyType(p.rep),eve=addDays((x&&x.date)||today(),-1);
  const ideal=new Date(p.first.getTime()-8*3600000);
  let bed=clampD(ideal,at(eve,20,0),at(eve,23,0)),late=false;
  const home=x?prevHome(x):null;if(home&&home.getTime()+45*60000>bed.getTime()){bed=new Date(home.getTime()+45*60000);late=true}
  const sleepH=(p.first-bed)/3600000;
  return {type,bed,late,home,sleepH,wake:type==="late"||type==="night"?new Date(Math.min(p.first.getTime(),bed.getTime()+8*3600000)):p.first};
}
function dayPlanBody(p,x){
  const sp=sleepPlan(p,x),type=sp.type,D=DUTY[type],bed=sp.bed,eve=addDays((x&&x.date)||today(),-1),tl=[];
  const M=(d,ms)=>new Date(d.getTime()+ms*60000);
  if(sp.late)tl.push([sp.home,"Home from your duty. Light snack only"]);
  else{
    tl.push([clampD(M(bed,-180),at(eve,17,0),at(eve,20,30)),"Evening meal"]);
    if(type==="early"||type==="day"||(x&&x.kind==="standby"))tl.push([clampD(M(bed,-90),at(eve,18,0),at(eve,21,0)),"Pack bag, lay out uniform, check kit"+(S.evening&&S.evening.items.length?" and your evening prep (below)":"")]);
    tl.push([M(bed,-30),"Screens off, wind down"]);
  }
  tl.push([bed,sp.late?"Straight to bed":sp.sleepH>=7.5?"Lights out, about 8 hours' sleep":"Lights out. Rest as much as you can before the alarm"]);
  if(x&&x.kind==="standby"){tl.push([p.rep,"Standby starts"])}
  else{
    if(type==="late"||type==="night"){
      const w=sp.wake;tl.push([w,"Wake up at a normal time and get some daylight"]);
      tl.push([M(w,30),"Breakfast"]);
      tl.push([clampD(M(w,120),M(w,60),M(p.first,-30)),"Pack bag, lay out uniform, check kit"+(S.evening&&S.evening.items.length?" and your prep (below)":"")]);
      const meal=M(p.rep,-240);if(meal>M(w,180))tl.push([meal,"Main meal before work"]);
      if(type==="night")tl.push([M(p.rep,-390),"Rest or nap for about 90 minutes"]);
      else if(p.rep.getHours()>=15&&M(p.rep,-300)>M(w,240))tl.push([M(p.rep,-300),"Optional nap, 20 to 30 minutes"]);
    }
    const lateDay=type==="late"||type==="night";let first=true;
    S.steps.forEach((st,i)=>{if(!p.times[i])return;const lb=st.label||"Next step";if(lateDay&&/alarm|snooze|breakfast|wake/i.test(lb))return;tl.push([p.times[i],lateDay&&first?"Start getting ready: "+lb.toLowerCase():lb]);first=false});
    tl.push([p.leave,"Leave for work"],[p.rep,"Report"]);
  }
  tl.sort((a,b)=>a[0]-b[0]);
  const note=sp.late?`You get home late, so the plan starts from then. Skip the extras and sleep.`:bed.getHours()===23&&bed.getMinutes()===0&&(type==="late"||type==="night")?`Keep a normal bedtime the night before a late: no later than 23:00, then a normal morning.`:sp.sleepH<7?`That's about ${fmtMins(sp.sleepH*60)} of sleep. Go to bed as soon as you can.`:"";
  return `<span class="chip">${D.name}</span>
    ${note?`<p style="margin:0">${note}</p>`:""}
    <div>${tl.map(t=>`<div class="tip"><span class="t clk">${hm(t[0])}</span><span>${esc(t[1])}</span></div>`).join("")}</div>
    ${on("evening")?eveningBody():""}
    <ul class="plain">${D.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
}

async function pinKey(k){

  if(k==="forgot"){lockMsg="Without your PIN the data can't be opened. You can erase it and start again, then restore a backup.";drawLock();
    const el=$("#lock .lk");if(el&&!$("#lock [data-pin=wipe]"))el.insertAdjacentHTML("beforeend",`<button class="danger" data-pin="wipe">Erase everything on this phone</button>`);return}

}
